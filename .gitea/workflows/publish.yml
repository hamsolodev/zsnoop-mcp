name: Publish to Gitea PyPI

# Build the zsnoop-mcp package and publish the wheel to the private
# Gitea PyPI registry. Never public PyPI via this path — the package
# is installed locally by end users.
#
# Requires a repo secret PYPI_UPLOAD_TOKEN = a Gitea token with
# **package write** scope (use a dedicated token; do not reuse a PAT).
#
# Each tag is a new hatch-vcs version, so uploads never collide
# (Gitea's registry rejects duplicate filenames outright).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # See the matching note in test.yml: reflinks fail with EAGAIN on the
  # ZFS-backed runners, so make uv copy rather than clone/hardlink.
  UV_LINK_MODE: copy

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs resolves version from tags/history

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: false  # no cache service on self-hosted runners (see swarm-stacks#27)

      - name: Test the package
        run: |
          uv sync --group dev
          uv run pytest -q

      - name: Build the wheel
        run: |
          # Wheel ONLY — a pure-Python wheel is all the private registry
          # needs, and building it straight from the checkout keeps
          # hatch-vcs reading the version from .git rather than from an
          # intermediate sdist.
          uv build --wheel

      - name: Verify the agent is force-included in the wheel
        run: |
          set -eo pipefail
          wheel=$(ls dist/zsnoop_mcp-*.whl)
          unzip -l "$wheel" | grep -q "zsnoop_mcp/_agent_source/zfs_snoop_agent.py" \
            || { echo "ERROR: agent script not present in wheel" >&2; exit 1; }

      - name: Publish to the Gitea PyPI registry
        env:
          # `uv publish` rather than twine: twine is not in the runner image
          # and is not a project dependency, so the previous step could only
          # ever exit 127. uv is already on PATH from setup-uv.
          UV_PUBLISH_URL: https://git.svc.home.tropism.net/api/packages/mch/pypi
          UV_PUBLISH_USERNAME: mch
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_UPLOAD_TOKEN }}
        run: uv publish dist/*.whl
